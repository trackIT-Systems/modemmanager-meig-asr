name: Build ModemManager MeiG ASR plugins

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates dpkg-dev git gettext \
            meson ninja-build pkg-config patchelf python3 xsltproc \
            libdbus-1-dev libglib2.0-dev libgudev-1.0-dev \
            libmbim-glib-dev libqmi-glib-dev libqrtr-glib-dev \
            libpolkit-gobject-1-dev libsystemd-dev systemd-dev \
            modemmanager

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build plugins
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            ./build.sh "$GITHUB_REF_NAME"
          else
            ./build.sh
          fi

      - name: Check symbols against Debian's modemmanager
        run: ./check-symbols.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: modemmanager-meig-asr-arm64
          path: dist/*.tar.gz

      - name: Extract release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES_FILE="${RUNNER_TEMP}/release_notes.md"
          if awk -v tag="$TAG" '
            $0 ~ "^## \\[" tag "\\]" { found=1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$NOTES_FILE" && [ -s "$NOTES_FILE" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG" > "$NOTES_FILE"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
          echo "path=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          prerelease: True
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.found == 'false' }}
          files: dist/*.tar.gz
